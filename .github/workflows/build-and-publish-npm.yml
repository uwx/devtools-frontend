name: Build and Publish to NPM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout depot_tools
        run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git

      - name: Add depot_tools to path
        run: echo $(realpath depot_tools) >> $GITHUB_PATH

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: devtools/devtools-frontend

      - name: Create gclient config
        run: gclient config --unmanaged https://chromium.googlesource.com/devtools/devtools-frontend
        working-directory: devtools

      - name: Sync dependencies
        run: gclient sync
        working-directory: devtools/devtools-frontend

      - name: Generate build files (gn)
        run: gn gen out/Default
        working-directory: devtools/devtools-frontend

      - name: Build DevTools Frontend (autoninja)
        run: autoninja -C out/Default
        working-directory: devtools/devtools-frontend

      - name: Set up Node.js for NPM
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare for npm publish
        working-directory: devtools/devtools-frontend
        run: |
          # Remove the internal .npmrc that points to internal registry
          rm -f .npmrc

      - name: Create tag and publish to npm
        working-directory: devtools/devtools-frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Get commit SHA (short form)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          FULL_COMMIT_SHA=$(git rev-parse HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          
          # Create version from commit SHA with prefix
          # Format: 0.0.0-commit.abc1234.20231126123456
          VERSION="0.0.0-commit.${COMMIT_SHA}.${TIMESTAMP}"
          
          # Create tag with prefix (tags can't be just a commit hash)
          TAG_NAME="npm-${COMMIT_SHA}"
          
          # Set the version in package.json
          npm version --no-git-tag-version $VERSION
          
          # Create and push the tag
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "npm publish for commit ${FULL_COMMIT_SHA}"
          git push origin "$TAG_NAME" || echo "Tag already exists, continuing..."
          
          # Publish to npm
          cd devtools/devtools-frontend
          npm publish --provenance --access public
